name: "Suggest a Feature"
description: "Suggest a new feature or improvement."
title: "[Idea] "
labels: []
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
      description: "Describe your idea as clearly as possible."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional Details
    validations:
      required: false
