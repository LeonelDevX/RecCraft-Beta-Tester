name: "Report a Bug"
description: "Report a problem with a RecCraft beta build."
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! Please describe the problem clearly. Do not include passwords or access tokens."
  - type: input
    id: version
    attributes:
      label: Beta Version
      description: "Version number or release name"
      placeholder: "e.g. Beta 0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft Version / Mod Loader
      placeholder: "e.g. Minecraft version, Fabric/Forge, or no loader"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, Logs, or Additional Details
      description: "Remove sensitive information from logs before uploading."
    validations:
      required: false
