name: "Fehler melden"
description: "Melde einen Fehler in einer RecCraft-Beta."
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Danke fürs Testen! Bitte beschreibe den Fehler möglichst genau. Keine Passwörter oder Tokens posten."
  - type: input
    id: version
    attributes:
      label: Beta-Version
      description: "Versionsnummer oder Release-Name"
      placeholder: "z. B. Beta 0.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft-Version / Mod-Loader
      placeholder: "z. B. Minecraft-Version, Fabric/Forge oder ohne Loader"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was sollte passieren?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, Logs oder weitere Hinweise
      description: "Bitte sensible Daten aus Logs entfernen."
    validations:
      required: false
